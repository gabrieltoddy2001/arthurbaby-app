spring.application.name=arthurbaby-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:arthurbaby;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:arthurbaby-dev-secret-key-with-at-least-32-characters}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

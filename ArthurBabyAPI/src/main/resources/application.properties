spring.application.name=arthurbaby-api
server.port=8080
server.address=0.0.0.0

# Perfil padrao: mysql (usa application-mysql.properties, banco "arthurbaby" no MySQL local).
# Para rodar sem MySQL, use o perfil "h2": -Dspring.profiles.active=h2
# (o perfil h2 nao tem arquivo proprio, entao valem as configuracoes H2 abaixo).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# H2 em memoria permite iniciar a API sem instalar um banco de dados.
spring.datasource.url=jdbc:h2:mem:arthurbaby;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datas como texto ISO (o formato com milissegundos e aplicado em JacksonConfig.java).
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:arthurbaby-dev-secret-key-with-at-least-32-characters}
app.jwt.expiration-minutes=720

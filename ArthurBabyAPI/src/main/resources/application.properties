# ============================================
# PERFIL ATIVO
# Padrao: mysql (usa application-mysql.properties, banco "arthurbaby" no MySQL local).
# Para rodar sem MySQL, use o perfil "h2": -Dspring.profiles.active=h2
# (o perfil h2 nao tem arquivo proprio, entao valem as configuracoes H2 abaixo).
# ============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# ============================================
# SEGREDOS — nunca no codigo
# Lidos de variaveis de ambiente (DB_PASSWORD, JWT_SECRET, SEED_SENHA_INICIAL) ou do arquivo
# application-local.properties na pasta ArthurBabyAPI (ignorado pelo Git; modelo em application-local.properties.example).
# ============================================
spring.config.import=optional:file:./application-local.properties

# ============================================
# SERVIDOR
# ============================================
spring.application.name=arthurbaby-api
server.port=8080
server.address=0.0.0.0

# ============================================
# BANCO DE DADOS
# Base: H2 em memoria (perfil h2, sem instalar banco). No perfil mysql, o
# application-mysql.properties substitui url/usuario/senha/driver pelo MySQL.
# ============================================
spring.datasource.url=jdbc:h2:mem:arthurbaby;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Datas como texto ISO (o formato com milissegundos e aplicado em JacksonConfig.java).
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================
# INICIALIZAÇÃO
# ============================================
spring.sql.init.mode=never

# ============================================
# H2 CONSOLE: desativado (daria acesso direto ao banco sem login)
# ============================================
spring.h2.console.enabled=false

# ============================================
# JWT
# ============================================
# Sem JWT_SECRET (minimo 32 caracteres) a API gera uma chave aleatoria a cada inicio (tokens antigos deixam de valer)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=720
# Tokens de ADMINISTRADOR e VENDEDOR (painel) duram menos: 2 horas
app.jwt.expiration-minutes-equipe=120

#=============================================
# Upload de imagens dos produtos
#=============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Endereco gravado nas URLs das fotos enviadas: cada maquina pode definir o seu em IMAGEM_BASE_URL
arthurbaby.imagem.base-url=${IMAGEM_BASE_URL:http://192.168.100.171:8080}

# ============================================
# PERFIL ATIVO — MySQL
# ============================================
spring.profiles.active=mysql

# ============================================
# SERVIDOR
# ============================================
spring.application.name=arthurbaby-api
server.port=8080
server.address=0.0.0.0

# ============================================
# BANCO DE DADOS — MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/arthurbaby?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Admin321
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# INICIALIZAÇÃO
# ============================================
spring.sql.init.mode=never

# ============================================
# H2 CONSOLE (desativado — usando MySQL)
# ============================================
spring.h2.console.enabled=false

# ============================================
# JWT
# ============================================
app.jwt.secret=arthurbaby-dev-secret-key-with-at-least-32-characters
app.jwt.expiration-minutes=720